[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-lot-accounting-engine"
version = "0.1.0"
description = "Track inventory lots, partial disposals, transfer continuity and realized cost basis under FIFO and LIFO."
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
crypto-lot-accounting-engine = "cryptolab:main"

[tool.setuptools.packages.find]
include = ["cryptolab*"]

[tool.setuptools.package-data]
cryptolab = ["web/*"]
